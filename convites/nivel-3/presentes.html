<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Redirecionando para o convite</title></head>
<body><p>O convite mudou de endereço. <a id="go" href="https://lzwebstudio-gestaodecasamentos.vercel.app/convite/presentes.html">Continuar</a></p>
<script>
  const destination = new URL("https://lzwebstudio-gestaodecasamentos.vercel.app/convite/presentes.html");
  destination.search = window.location.search;
  destination.hash = window.location.hash;
  document.getElementById('go').href = destination.href;
  window.location.replace(destination.href);
</script></body></html>
